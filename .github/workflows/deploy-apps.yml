name: Deploy App VM Services

on:
  push:
    branches: [ master ]
    paths:
      - 'services/apps/**'
      - 'infra/apps/**'

# Ensure single concurrency deploy to avoid memory contention
concurrency:
  group: deploy-apps
  cancel-in-progress: false

jobs:
  build-and-push-apps:
    name: Build Apps & Trigger Remote SSH Deploy (4GB VM)
    runs-on: self-hosted
    env:
      REGISTRY: localhost:5000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed App Services
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend: 'services/apps/backend/**'
            frontend: 'services/apps/frontend/**'
            bus-scraper: 'services/apps/bus-scraper/**'
            health-ingester: 'services/apps/health-ingester/**'
            irrigation-mqtt: 'services/apps/irrigation-mqtt/**'

      - name: Build & Push Backend
        if: steps.filter.outputs.backend == 'true'
        run: |
          docker build -f services/apps/backend/Dockerfile -t ${REGISTRY}/backend:sha-${GITHUB_SHA::7} -t ${REGISTRY}/backend:latest .
          docker push ${REGISTRY}/backend:sha-${GITHUB_SHA::7}
          docker push ${REGISTRY}/backend:latest

      - name: Build & Push Frontend
        if: steps.filter.outputs.frontend == 'true'
        run: |
          docker build -f services/apps/frontend/Dockerfile -t ${REGISTRY}/frontend:sha-${GITHUB_SHA::7} -t ${REGISTRY}/frontend:latest services/apps/frontend/
          docker push ${REGISTRY}/frontend:sha-${GITHUB_SHA::7}
          docker push ${REGISTRY}/frontend:latest

      - name: Build & Push Bus Scraper
        if: steps.filter.outputs.bus-scraper == 'true'
        run: |
          docker build -f services/apps/bus-scraper/Dockerfile -t ${REGISTRY}/bus-scraper:sha-${GITHUB_SHA::7} -t ${REGISTRY}/bus-scraper:latest .
          docker push ${REGISTRY}/bus-scraper:sha-${GITHUB_SHA::7}
          docker push ${REGISTRY}/bus-scraper:latest

      - name: Build & Push Health Ingester
        if: steps.filter.outputs.health-ingester == 'true'
        run: |
          docker build -f services/apps/health-ingester/Dockerfile -t ${REGISTRY}/health-ingester:sha-${GITHUB_SHA::7} -t ${REGISTRY}/health-ingester:latest .
          docker push ${REGISTRY}/health-ingester:sha-${GITHUB_SHA::7}
          docker push ${REGISTRY}/health-ingester:latest

      - name: Build & Push Irrigation MQTT
        if: steps.filter.outputs.irrigation-mqtt == 'true'
        run: |
          docker build -f services/apps/irrigation-mqtt/Dockerfile -t ${REGISTRY}/irrigation-mqtt:sha-${GITHUB_SHA::7} -t ${REGISTRY}/irrigation-mqtt:latest .
          docker push ${REGISTRY}/irrigation-mqtt:sha-${GITHUB_SHA::7}
          docker push ${REGISTRY}/irrigation-mqtt:latest


      - name: SSH Deploy to App VM (Pull Pre-built Images)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VM_HOST }}
          username: ${{ secrets.APP_VM_USER }}
          key: ${{ secrets.APP_VM_SSH_KEY }}
          script: |
            cd /opt/homelab/infra/apps
            docker compose pull
            docker compose up -d
