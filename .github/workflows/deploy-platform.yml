name: Deploy Platform VM Services

on:
  push:
    branches: [ master ]
    paths:
      - 'services/platform/**'
      - 'infra/platform/**'
      - 'infra/monitoring/**'

# Ensure single concurrency deploy on the 8GB Platform VM
concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  build-and-deploy-platform:
    name: Build & Deploy Platform Services (Local 8GB VM)
    runs-on: self-hosted
    env:
      REGISTRY: localhost:5000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Platform Services
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            airflow: 'services/platform/airflow/**'

      - name: Build & Push Airflow Image
        if: steps.filter.outputs.airflow == 'true'
        run: |
          IMAGE_NAME="${REGISTRY}/airflow"
          TAG="sha-${GITHUB_SHA::7}"
          docker build -f services/platform/airflow/Dockerfile -t ${IMAGE_NAME}:${TAG} -t ${IMAGE_NAME}:latest .
          docker push ${IMAGE_NAME}:${TAG}
          docker push ${IMAGE_NAME}:latest


      - name: Deploy Platform Containers via Docker Compose
        run: |
          cd infra/platform
          docker compose pull
          docker compose up -d
