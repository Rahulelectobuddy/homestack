name: Deploy Unified Homelab Data Platform

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip post-deployment validation tests'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Unified Stack (Host 192.168.1.29)
    runs-on: self-hosted
    env:
      REGISTRY: localhost:5000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Local Docker Registry is Up
        run: |
          docker compose up -d registry

      - name: Build & Push All Service Images
        run: |
          chmod +x scripts/build-and-push-all.sh
          ./scripts/build-and-push-all.sh localhost:5000

      - name: Deploy Containers via Docker Compose
        run: |
          docker compose up -d

      - name: Run Post-Deployment Validation Suite
        if: ${{ inputs.skip_tests != true }}
        run: |
          chmod +x scripts/test-stack.sh
          ./scripts/test-stack.sh 192.168.1.29


